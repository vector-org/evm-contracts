[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
]

solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]

[rpc_endpoints]
sepolia = "https://sepolia.infura.io/v3/2WCbZ8YpmuPxUtM6PzbFOfY5k4B"
arbitrum_sepolia = "https://arbitrum-sepolia.infura.io/v3/2WCbZ8YpmuPxUtM6PzbFOfY5k4B" 
base_sepolia = "https://base-sepolia.infura.io/v3/2WCbZ8YpmuPxUtM6PzbFOfY5k4B"
vector = "https://rpc.evm.wasm.host/"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
vector = { key = "${BLOCKSCOUT_API_KEY}" }

[profile.vector]
eth_rpc_timeout = 120000 # 2 minutes
block_number = 0

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000