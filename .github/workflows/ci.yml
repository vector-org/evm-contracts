name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint and Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Install Foundry dependencies
        run: forge install

      - name: Solhint
        run: npm run lint

      - name: Forge lint
        run: npm run forge:lint

      - name: Format check
        run: npm run format:check

      - name: Compile
        run: npm run compile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Install Foundry dependencies
        run: forge install

      - name: Test
        run: npm run test

      - name: Gas report
        run: npm run test:gas
